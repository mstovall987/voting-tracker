<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voting Tracker</title>
  <meta name="description" content="What every U.S. senator proposes and how they vote, rebuilt from official congressional data.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <script>
    // Apply a saved light/dark choice before the page paints, so it never flashes.
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) { /* storage unavailable */ }
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5/400-italic.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='%231d1d1f'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='10.6' cy='19.6' r='1.3'/%3E%3Ccircle cx='14' cy='16.2' r='1.3'/%3E%3Ccircle cx='17.4' cy='19.6' r='1.3'/%3E%3Ccircle cx='7.4' cy='19.6' r='1.3'/%3E%3Ccircle cx='9.33' cy='14.93' r='1.3'/%3E%3Ccircle cx='14' cy='13' r='1.3'/%3E%3Ccircle cx='18.67' cy='14.93' r='1.3'/%3E%3Ccircle cx='20.6' cy='19.6' r='1.3'/%3E%3Ccircle cx='4.2' cy='19.6' r='1.3'/%3E%3Ccircle cx='5.51' cy='14.7' r='1.3'/%3E%3Ccircle cx='9.1' cy='11.11' r='1.3'/%3E%3Ccircle cx='14' cy='9.8' r='1.3'/%3E%3Ccircle cx='18.9' cy='11.11' r='1.3'/%3E%3Ccircle cx='22.49' cy='14.7' r='1.3'/%3E%3Ccircle cx='23.8' cy='19.6' r='1.3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="#/senate" aria-label="Voting Tracker home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="28" height="28">
            <rect width="28" height="28" rx="8" fill="currentColor"/>
            <g class="dots">
              <circle cx="10.6" cy="19.6" r="1.3"/><circle cx="14" cy="16.2" r="1.3"/><circle cx="17.4" cy="19.6" r="1.3"/>
              <circle cx="7.4" cy="19.6" r="1.3"/><circle cx="9.33" cy="14.93" r="1.3"/><circle cx="14" cy="13" r="1.3"/>
              <circle cx="18.67" cy="14.93" r="1.3"/><circle cx="20.6" cy="19.6" r="1.3"/><circle cx="4.2" cy="19.6" r="1.3"/>
              <circle cx="5.51" cy="14.7" r="1.3"/><circle cx="9.1" cy="11.11" r="1.3"/><circle cx="14" cy="9.8" r="1.3"/>
              <circle cx="18.9" cy="11.11" r="1.3"/><circle cx="22.49" cy="14.7" r="1.3"/><circle cx="23.8" cy="19.6" r="1.3"/>
            </g>
          </svg>
        </span>
        <span class="brand-name">Voting Tracker</span>
      </a>
      <details class="branch-switch" id="branch-switch">
        <summary aria-label="Choose a branch of government">
          <span id="branch-current">Senate</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <nav class="branch-nav" aria-label="Branch of government">
          <a href="#/senate" data-branch="senate">U.S. Senate <span class="soon live">Live</span></a>
          <a href="#/house" data-branch="house">House of Representatives <span class="soon">Next</span></a>
          <a href="#/president" data-branch="president">The President <span class="soon">Soon</span></a>
          <a href="#/states" data-branch="states">State legislatures <span class="soon">Later</span></a>
        </nav>
      </details>
      <nav class="section-nav" id="section-nav" aria-label="Senate sections">
        <a href="#/senate" data-section="home">Overview</a>
        <a href="#/senate/senators" data-section="senators">Senators</a>
        <a href="#/senate/compare" data-section="compare">Compare</a>
        <a href="#/senate/topics" data-section="topics">Topics</a>
        <a href="#/senate/legislation" data-section="legislation">Legislation</a>
        <a href="#/senate/votes" data-section="votes">Votes</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark mode">
        <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="wrap" id="footer"></div>
  </footer>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script>
    // Opened by double-clicking the file? Browsers block the site's scripts and data there.
    if (location.protocol === 'file:') {
      document.getElementById('main').innerHTML =
        '<div class="error-box"><h2>Open the tracker through its local web server</h2>' +
        '<p class="ink-2" style="margin-top:8px">Browsers block a page opened straight from a file from loading its data, so only the header shows.</p>' +
        '<p style="margin-top:8px">In the project folder, double-click <strong>Start Voting Tracker.bat</strong> ' +
        '(or run <code>python serve.py</code>). It opens <a href="http://localhost:8000">http://localhost:8000</a> for you.</p></div>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
