<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voting Tracker · Every vote, on the record</title>
  <meta name="description" content="What every U.S. senator writes, signs on to and votes for, rebuilt from official congressional records. A minimalist design preview of the front page.">
  <meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
  <script>
    // Same saved light/dark choice as the main tracker, applied before the page paints.
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) { /* storage unavailable */ }
    // This preview is only the front page: links into the tracker ("#/senate/...") open the main app.
    const toApp = () => { if (location.hash.startsWith('#/')) location.replace('./' + location.hash); };
    toApp();
    addEventListener('hashchange', toApp);
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5/400-italic.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/instrument-sans@5/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fragment-mono@5/index.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23121211'/%3E%3Cg fill='%23f4f2ed'%3E%3Crect x='7' y='8' width='2' height='16'/%3E%3Crect x='12' y='8' width='2' height='16'/%3E%3Crect x='17' y='8' width='2' height='16'/%3E%3Crect x='22' y='8' width='2' height='16'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/minimal.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="mast" id="top">
    <div class="mast-row">
      <a class="wordmark" href="#top" aria-label="Voting Tracker, top of page">Voting <em>Tracker</em></a>
      <nav class="branches" aria-label="Branch of government">
        <a href="#top" aria-current="page">Senate</a>
        <a href="./#/house">House</a>
        <a href="./#/president">President</a>
      </nav>
      <div class="mast-end">
        <span class="dateline" id="dateline"></span>
        <button class="theme" id="theme" type="button" aria-label="Switch to dark mode"><span aria-hidden="true"></span></button>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <p class="boot" role="status">Loading the Senate…</p>
  </main>
  <footer class="foot" id="foot"></footer>
  <script>
    // Opened by double-clicking the file? Browsers block the page's scripts and data there.
    if (location.protocol === 'file:') {
      document.getElementById('main').innerHTML =
        '<div class="boot"><p><strong>Open this page through the local web server.</strong></p>' +
        '<p>Double-click <strong>Start Voting Tracker.bat</strong> (or run <code>python serve.py</code>), ' +
        'then go to <a href="http://localhost:8000/minimal.html">http://localhost:8000/minimal.html</a>.</p></div>';
    }
  </script>
  <script type="module" src="js/minimal.js"></script>
</body>
</html>
